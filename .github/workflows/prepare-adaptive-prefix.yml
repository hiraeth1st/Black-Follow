name: Prepare Adaptive Prefix Recovery
on:
  push:
    branches: [adaptive-prefix-recovery]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply and test adaptive recovery
        run: |
          python3 tools/prepare_adaptive.py
          bash test.sh
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash build-apk.sh
          ! grep -R -E "0\.4\.1-test|Black-Follow-0\.4\.1|versionCode 16|android:versionCode=\"16\"" app README.md TEST-RESULTS.md GITHUB-SETUP.md build-apk.sh
      - name: Commit prepared sources
        run: |
          rm .github/workflows/prepare-adaptive-prefix.yml tools/prepare_adaptive.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prioritize targeted and dense prefix recovery"
          git push origin HEAD:adaptive-prefix-recovery
