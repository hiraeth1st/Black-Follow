name: Prepare Black Follow 0.4.4
on:
  push:
    branches: [turkish-search-1000]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply, test and build 0.4.4
        run: |
          python3 tools/prepare_044.py
          bash test.sh
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash build-apk.sh
          grep -F 'SEARCH_COUNT=1000' app/src/main/java/com/blackapps/follow/PrefixSearchLogic.java
          grep -F 'TURKISH_SEARCH_ALPHABET="çğıöşü"' app/src/main/java/com/blackapps/follow/PrefixSearchLogic.java
          grep -F 'count=query.isEmpty()?200:PrefixSearchLogic.SEARCH_COUNT' app/src/main/java/com/blackapps/follow/InstagramClient.java
          grep -F 'matchesSearchResult(person.username,person.name,prefix)' app/src/main/java/com/blackapps/follow/InstagramClient.java
          ! grep -R -E "0\.4\.3-test|Black-Follow-0\.4\.3|versionCode 18|android:versionCode=\"18\"" app README.md TEST-RESULTS.md GITHUB-SETUP.md build-apk.sh
      - name: Commit prepared sources
        run: |
          rm .github/workflows/prepare-044.yml tools/prepare_044.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 1000-result and Turkish-letter searches"
          git push origin HEAD:turkish-search-1000
# trigger
