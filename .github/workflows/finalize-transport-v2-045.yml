name: Finalize Transport Audit V2 0.4.5
on:
  push:
    branches: [follower-audit-045]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply and verify final relationship transport
        run: |
          python3 tools/prepare_claim_045.py
          python3 tools/apply_client_transport_v2.py
          python3 tools/fix_generated_java_045.py
          bash test.sh
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash build-apk.sh
          grep -F 'WEB_SEARCH_SIZE=100' app/src/main/java/com/blackapps/follow/RelationshipRequest.java
          grep -F 'MAX_STREAMS=10' app/src/main/java/com/blackapps/follow/RelationshipRequest.java
          grep -F 'relationshipSearch(id,kind,query)' app/src/main/java/com/blackapps/follow/InstagramClient.java
          grep -F 'RelationLogic.recoverable(issue)' app/src/main/java/com/blackapps/follow/InstagramClient.java
          grep -F 'X-ASBD-ID' app/src/main/java/com/blackapps/follow/InstagramClient.java
          grep -F 'remove("www_claim")' app/src/main/java/com/blackapps/follow/LoginActivity.java app/src/main/java/com/blackapps/follow/MainActivity.java
          ! grep -R -E 'SEARCH_COUNT=1000|&count=1000|_recovery_' app/src/main/java
      - name: Commit audited transport sources
        run: |
          rm -f .github/workflows/finalize-transport-v2-045.yml .github/workflows/finalize-transport-045.yml tools/apply_client_transport_v2.py tools/finalize_transport_045.py tools/prepare_claim_045.py tools/fix_generated_java_045.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize audited relationship retrieval transport"
          git push origin HEAD:follower-audit-045
# trigger 4