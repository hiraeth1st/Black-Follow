name: Finalize Exact Search Fallback 0.4.5
on:
  push:
    branches: [follower-audit-045]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply and verify exact-search fallback
        run: |
          python3 tools/finalize_target_045.py
          bash test.sh
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash build-apk.sh
          grep -F 'if(part.unsupported){result.unsupported++;traceSearchUnsupported(kind,"hedefli",part.failureCode,found.size(),expected);break;}' app/src/main/java/com/blackapps/follow/InstagramClient.java
      - name: Commit final source
        run: |
          rm .github/workflows/finalize-target-045.yml tools/finalize_target_045.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Probe canonical search after an exact-query rejection"
          git push origin HEAD:follower-audit-045
# trigger
