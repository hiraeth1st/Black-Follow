name: Prepare Black Follow 0.4.5
on:
  push:
    branches: [follower-audit-045]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply audited relationship retrieval update
        run: |
          python3 tools/prepare_045.py
          bash test.sh
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash build-apk.sh
          grep -F 'PAGE_SIZE=200' app/src/main/java/com/blackapps/follow/RelationshipRequest.java
          grep -F 'Relationship search is a separate, non-cursor request' app/src/main/java/com/blackapps/follow/RelationshipRequest.java
          grep -F 'found.put(person.id,person);' app/src/main/java/com/blackapps/follow/InstagramClient.java
          grep -F 'PreviewLogic.merge' app/src/main/java/com/blackapps/follow/Store.java
          ! grep -R -E 'count=1000|SEARCH_COUNT=1000|0\.4\.4-test|Black-Follow-0\.4\.4|versionCode 19|android:versionCode="19"' app tests README.md TEST-RESULTS.md GITHUB-SETUP.md build-apk.sh
      - name: Commit prepared sources
        run: |
          rm .github/workflows/prepare-045.yml tools/prepare_045.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit and repair follower relationship retrieval"
          git push origin HEAD:follower-audit-045
# trigger 2
