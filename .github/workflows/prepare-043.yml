name: Prepare Black Follow 0.4.3
on:
  push:
    branches: [adaptive-prefix-recovery]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply, test and build 0.4.3
        run: |
          python3 tools/prepare_043.py
          bash test.sh
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash build-apk.sh
          grep -F 'includes_hashtags=false' app/src/main/java/com/blackapps/follow/InstagramClient.java
          grep -F 'matchingRows<knownPopulation' app/src/main/java/com/blackapps/follow/PrefixSearchLogic.java
          ! grep -R -E "0\.4\.2-test|Black-Follow-0\.4\.2|versionCode 17|android:versionCode=\"17\"" app README.md TEST-RESULTS.md GITHUB-SETUP.md build-apk.sh
      - name: Commit prepared sources
        run: |
          rm .github/workflows/prepare-043.yml tools/prepare_043.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add multi-pass REST and omission-aware prefix recovery"
          git push origin HEAD:adaptive-prefix-recovery
