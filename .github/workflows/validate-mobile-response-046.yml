name: Validate Mobile Completion 0.4.6
on:
  push:
    branches: [strict-complete-046]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply and validate response handling
        run: |
          python3 tools/fix_mobile_response_046.py
          bash test.sh
          bash build-apk.sh
          grep -F 'BF_MOBILE_SIGN_IN' app/src/main/java/com/blackapps/follow/MobileInstagramClient.java
          grep -F 'JSON olmayan yanıt' app/src/main/java/com/blackapps/follow/MobileInstagramClient.java
      - name: Commit validated sources
        run: |
          rm .github/workflows/validate-mobile-response-046.yml tools/fix_mobile_response_046.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden mobile completion response handling"
          git push origin HEAD:strict-complete-046
# trigger