name: Prepare Black Follow 0.4.6
on:
  push:
    branches: [strict-complete-046]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply, test and build strict completion
        run: |
          python3 tools/prepare_046.py
          bash test.sh
          bash build-apk.sh
          grep -F 'API_ORIGIN="https://i.instagram.com"' app/src/main/java/com/blackapps/follow/MobileRequestLogic.java
          grep -F 'FOLLOWERS_DOC_ID="28479704797510738576165798526"' app/src/main/java/com/blackapps/follow/MobileRequestLogic.java
          grep -F 'FOLLOWING_DOC_ID="161046392817718486717479294775"' app/src/main/java/com/blackapps/follow/MobileRequestLogic.java
          grep -F 'MobileInstagramClient mobileClient' app/src/main/java/com/blackapps/follow/InstagramClient.java
          grep -F 'scheduleStrict(c)' app/src/main/java/com/blackapps/follow/Monitor.java
          grep -F 'STRICT_JOB=102' app/src/main/java/com/blackapps/follow/MonitorJob.java
          ! grep -R -E '0\.4\.5-test|Black-Follow-0\.4\.5|versionCode 20|android:versionCode="20"' app build-apk.sh
      - name: Commit prepared sources
        run: |
          rm .github/workflows/prepare-046.yml tools/prepare_046.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require complete lists and add private mobile completion"
          git push origin HEAD:strict-complete-046
