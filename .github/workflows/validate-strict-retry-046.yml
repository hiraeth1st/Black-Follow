name: Validate Strict Retry 0.4.6
on:
  push:
    branches: [strict-complete-046]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply and validate strict retry scheduling
        run: |
          python3 tools/fix_strict_retry_046.py
          bash test.sh
          bash build-apk.sh
          grep -F 'STRICT_NEEDED="strict_retry_needed"' app/src/main/java/com/blackapps/follow/MonitorJob.java
          grep -F 'if(previews==0)MonitorJob.cancelStrict(c);' app/src/main/java/com/blackapps/follow/Monitor.java
          grep -F 'if(strict&&Session.prefs(app).getBoolean(STRICT_NEEDED,false))' app/src/main/java/com/blackapps/follow/MonitorJob.java
          ! grep -F 'Session.dataSucceeded(c);MonitorJob.cancelStrict(c);' app/src/main/java/com/blackapps/follow/Monitor.java
      - name: Commit validated retry sources
        run: |
          rm .github/workflows/validate-strict-retry-046.yml tools/fix_strict_retry_046.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep strict completion retries scheduled until all accounts finish"
          git push origin HEAD:strict-complete-046
# trigger